
      - name: Create RDP User with Constant Password
        run: |
          $password = "windows1234"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          # Disable password complexity requirement
          secedit /export /cfg "$env:TEMP\secpol.cfg"

          $cfg = Get-Content "$env:TEMP\secpol.cfg"
          $cfg = $cfg -replace 'PasswordComplexity\s*=\s*\d+', 'PasswordComplexity = 0'
          $cfg | Set-Content "$env:TEMP\secpol.cfg"

          secedit /configure /db "$env:TEMP\secpol.sdb" /cfg "$env:TEMP\secpol.cfg" /areas SECURITYPOLICY

          # Set minimum password length to 1
          net accounts /minpwlen:1

          # Create or update RDP user
          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
              Set-LocalUser -Name "RDP" -Password $securePass
          } else {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }

          # Ensure account is enabled
          Enable-LocalUser -Name "RDP"

          # Add required permissions
          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue

          # Verify account
          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "RDP user creation failed"
              exit 1
          }

          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV

          Write-Host "RDP user configured successfully."
